<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"><div id="splash"><div class="sp-disc"></div><b>Spotizer</b></div></div>
<style>
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#1a0a1f;color:#fff;font:600 22px system-ui,sans-serif;letter-spacing:.04em}
.sp-disc{width:56px;height:56px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:#c084fc;animation:spl 1s linear infinite}
@keyframes spl{to{transform:rotate(360deg)}}
</style>
